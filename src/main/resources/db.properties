# ============================================================================
# DEFENSIVE GUIDE TO SQL INJECTION - DATABASE CONFIGURATION
# ============================================================================
# Configure your local MySQL database connection details here.
# Default settings connect to a local MySQL server (MySQL default port: 3306).
# If MySQL is not running, the application will automatically run in 
# "Interactive Safe Demo Mode" so students can still learn without disruption!
# ============================================================================

# Web Server Port (Default: 8080)
server.port=8080

# MySQL Connection Details
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/db_security_vac?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8

# Change these to your local MySQL username and password:
# Common XAMPP default: user=root, password= (blank)
# Common MySQL Workbench default: user=root, password=root or your chosen password
db.user=root
db.password=root

# Connection Pool / Timeout settings
db.timeout.seconds=5
